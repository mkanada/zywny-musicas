name: zywny
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.10+13

environment:
  sdk: ^3.13.3

# Pub workspace: o app na raiz e o mockup em apps/, com um `pubspec.lock` só,
# aqui. Os pacotes do núcleo compartilhado moram no zywny-comum (../zywny-comum).
workspace:
  - apps/zywny_mockup

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Núcleo compartilhado (zywny-comum, ao lado deste repositório): partitura,
  # prática, MIDI, som, configurações e interface. Dart não herda dependência
  # transitiva: cada pacote que este app importa direto aparece aqui.
  zywny_comum:
    path: ../zywny-comum
  zywny_music:
    path: ../zywny-comum/packages/zywny_music
  zywny_diag:
    path: ../zywny-comum/packages/zywny_diag
  zywny_audio:
    path: ../zywny-comum/packages/zywny_audio
  zywny_midi:
    path: ../zywny-comum/packages/zywny_midi
  zywny_library:
    path: ../zywny-comum/packages/zywny_library
  # Autenticação (fase D, D01): o contrato, o Firebase (SDK no Android/Web,
  # REST e loopback no desktop) e a regra dos 7 dias sem rede.
  zywny_auth:
    path: ../zywny-comum/packages/zywny_auth

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  # Descompactação dos dados do Verovio (assets/verovio_data.zip) e
  # diretório de destino da extração — ver render/verovio_resources.dart
  # (zywny-comum).
  archive: ^4.0.7
  path_provider: ^2.1.5
  # Bindings de dart:ffi (Pointer<Utf8>, malloc) do motor de som (K03, no
  # zywny-comum). Já vinha transitivo via o binding do Verovio.
  ffi: ^2.1.0
  # Web (W02): Worker e interop com o wasm do Verovio.
  web: ^1.1.0

  # Bindings FFI do fork do Verovio que exporta `.vsb` (Verovio Score
  # Bridge). O checkout fica ao lado deste repositório, em
  # ../verovio_flutter_bridge (pode ser um symlink) — ver o README.
  verovio:
    path: ../verovio_flutter_bridge/verovio/bindings/dart
  # Pacote que lê o `.vsb` e o desenha com CustomPaint — vive no zywny-comum
  # (score_bridge/, trazido do verovio_flutter_bridge via git subtree).
  score_bridge:
    path: ../zywny-comum/score_bridge
  google_fonts: ^8.2.1
  # Entrada MIDI (M01, D-MIDI): lista/conecta dispositivos e entrega
  # mensagens já tipadas (zywny-comum, midi/).
  flutter_midi_command: ^1.3.0
  # Guarda o último dispositivo MIDI escolhido (M01) para reconectar sozinho.
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.0
  cryptography: ^2.9.0
  yaml: ^3.1.4
  meta: ^1.19.0
  # I05 — Leitor de lição: AST do markdown (Dart puro; o zywny-aprendizado
  # desenha os widgets). `flutter_markdown` está descontinuado pelo time do
  # Flutter desde 2025, ver pub.dev, então não é usado.
  markdown: ^7.3.1
  # I05 — links do texto e cartão de vídeo abrem fora do app.
  url_launcher: ^6.3.3
  # "Sobre o Zywny": a versão do app (a mesma do `version:` acima). Já vinha
  # transitiva, pelo wakelock_plus; direta porque agora é usada direto.
  package_info_plus: ^10.2.1
  # I05 — `zywny-audio`: toca `.ogg`/`.mp3` a partir de bytes nas quatro
  # plataformas (na Web não há arquivo). Usado pelo zywny-aprendizado.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Roteiro que fotografa as telas no celular (integration_test/,
  # `just telas`).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Fakes de plataforma para test/widget_test.dart: sem eles, MidiCommand()
  # e SharedPreferencesAsync() abrem canais de plataforma inexistentes em
  # `flutter test` assim que ScoreHomePage constrói (M01).
  shared_preferences_platform_interface: ^2.4.2
  flutter_midi_command_platform_interface: ^1.3.0
  plugin_platform_interface: ^2.1.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Fontes de gravação do Verovio (Bravura, Leipzig, ... + os TTFs
    # Liberation de `data/text`), empacotadas num zip único porque o
    # bundler de assets do Flutter lista diretórios sem recursão. Gerado
    # pelo script de build do zywny-comum (tool/build_verovio_assets.sh) a
    # partir do verovio_flutter_bridge, e extraído em runtime por
    # render/verovio_resources.dart (zywny-comum). Não versionado.
    - assets/verovio_data.zip
    # Soundfont padrão (TimGM6mb, GPL-2 — ver TimGM6mb.copyright ao lado):
    # o som do app funciona sem o usuário procurar um `.sf2`. Ele pode
    # trocar por outro; ver audio/soundfont_store.dart (zywny-comum).
    - assets/soundfonts/TimGM6mb.sf2
    # O aviso de copyright do soundfont, mostrado na página de licenças do
    # "Sobre o Zywny" (about/licenses.dart, zywny-comum).
    - assets/soundfonts/TimGM6mb.copyright
    # Biblioteca inicial de peças clássicas em domínio público (43 peças,
    # gerada por `just pacote-classicos`). Instalada automaticamente no
    # primeiro uso quando nenhuma biblioteca está instalada.
    - assets/classicos.zywny
  # As fontes (Cormorant Garamond, Instrument Sans) são declaradas no
  # zywny-comum, e a serifada do texto comum (Liberation Serif) vem do pacote
  # score_bridge, registrada por loadScoreFonts().

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
